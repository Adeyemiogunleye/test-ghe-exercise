name: lint_test_deploy
on:
  push:
    branches: 
      - main
jobs:
  lint_test_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up node
        uses: actions/node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install

      - name: Lint code
        run: |
          npm run lint

      - name: Run tests
        run: |
          npm test

      - name: Deploy application
        if: success()
        run: |
          echo "Deploying application..."
          # Add your deployment commands here
  